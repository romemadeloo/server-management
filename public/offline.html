<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>You're offline | Glophics Portal</title>
    <style>
        /* Default palette from app/globals.css; this file must work by itself. */
        :root { color-scheme: light dark; --canvas: #ecefee; --surface: #ffffff; --ink: #333333; --body: #53615d; --line: #e5ebe9; --brand: #007f6d; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--canvas); color: var(--ink); font-family: system-ui, sans-serif; }
        main { width: 100%; max-width: 480px; padding: clamp(24px, 6vw, 48px); background: var(--surface); border: 1px solid var(--line); border-radius: 24px; }
        .brand { margin: 0 0 32px; color: var(--body); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
        h1 { margin: 0 0 16px; font-size: clamp(28px, 7vw, 36px); letter-spacing: -.04em; }
        p { color: var(--body); line-height: 1.7; }
        a { display: inline-block; margin-top: 16px; padding: 13px 22px; border-radius: 12px; background: var(--brand); color: #ffffff; font-weight: 700; text-decoration: none; }
        a:hover { text-decoration: underline; }
        a:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
        @media (prefers-color-scheme: dark) {
            :root { --canvas: #0e1211; --surface: #181d1c; --ink: #f3f5f4; --body: #adb8b4; --line: #29312f; }
        }
    </style>
</head>
<body>
    <main>
        <p class="brand">Glophics Portal</p>
        <h1>You're offline.</h1>
        <p>The board can't be shown without a connection, because an out-of-date board could say an environment is free when it isn't.</p>
        <p>Once you're back online, try again to load the latest board.</p>
        <a href="/dashboard">Try again</a>
    </main>
</body>
</html>
