<!DOCTYPE html>

<title>Glophics Portal</title>

<!--
  Tailwind v4 browser build: compiles in the page, including classes the
  views inject after load. No build step, matching the rest of the project.
  See prototypes/README.md before shipping this to production.
-->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  /*
    The palette is semantic, not literal: components ask for `bg-surface` and
    `text-muted`, never `bg-surface` or `text-muted`. Dark mode is then a
    single set of variable overrides below — no `dark:` variant on any
    component, and nothing to keep in sync when a colour changes.
  */
  @theme {
    /* Glophics brand: teal, charcoal, cool gray and white. */
    --color-brand-50:  #effbf8;
    --color-brand-100: #d8f5ef;
    --color-brand-200: #a8e7da;
    --color-brand-300: #54cfba;
    --color-brand-500: #007f6d;
    --color-brand-600: #006b5c;
    --color-brand-700: #00584c;

    /* surfaces */
    --color-canvas:    #ecefee;   /* behind the shell */
    --color-surface:   #ffffff;   /* cards, table bodies */
    --color-panel:     #f7f9f8;   /* the main content area */
    --color-subtle:    #f4f7f6;   /* inputs, inset blocks */
    --color-subtle-2:  #edf2f0;   /* tab strips, quiet badges */

    /* lines */
    --color-line:      #e5ebe9;
    --color-line-2:    #d1d8d5;
    --color-line-soft: #edf1f0;

    /* type */
    --color-ink:       #333333;
    --color-ink-2:     #454545;
    --color-body:      #53615d;
    --color-muted:     #64716d;
    --color-faint:     #87938f;
    --color-faintest:  #bcc5c2;

    /* the high-contrast action colour (dark pill buttons) */
    --color-accent:    #3d3d3d;
    --color-accent-2:  #505050;
    --color-on-accent: #ffffff;

    /* status — `-soft` is the chip background, the bare name is the text */
    --color-ok:        #047857;  --color-ok-soft:      #ecfdf5; --color-ok-strong:   #047857;
    --color-warn:      #b45309;  --color-warn-soft:    #fffbeb; --color-warn-strong: #92400e;
    --color-bad:       #be123c;  --color-bad-soft:     #fff1f2; --color-bad-strong:  #be123c;
    --color-info:      #007f6d;  --color-info-soft:    #effbf8;
    --color-alt:       #3d3d3d;  --color-alt-soft:     #eeeeee;
    --color-secondary: #3d3d3d;  --color-secondary-soft: #eeeeee;
    --color-brand-fg:  #007f6d;  --color-brand-soft:   #effbf8;
    --color-neutral:   #646b69;  --color-neutral-soft: #eef0ef;
  }
</style>

    --color-subtle:    #202725;

    --color-line-2:    #39433f;
    --color-line-soft: #222a28;

    --color-ink-2:     #d1d7d5;
    --color-body:      #adb8b4;

    --color-accent-2:  #cfd4d2;

  }

    --color-subtle: #f0f7fa; --color-subtle-2: #e4f0f5;
    --color-line: #e4f0f5; --color-line-2: #cbdde5; --color-line-soft: #edf5f8;
    --color-ink: #102a36; --color-ink-2: #234554; --color-body: #42616e;
    --color-muted: #587683; --color-faint: #7994a0; --color-faintest: #aec1c9;
    --color-accent: #102a36; --color-accent-2: #234554; --color-on-accent: #ffffff;
    --color-brand-fg: #0369a1; --color-brand-soft: #e8f7fc;
    --color-neutral: #587683; --color-neutral-soft: #e4f0f5;
  }

  html[data-theme="ocean"].dark {

    --color-brand-300: #38b9d6; --color-brand-500: #0369a1; --color-brand-600: #075985; --color-brand-700: #0c4a6e;
    --color-canvas: #061015; --color-surface: #0e1b22; --color-panel: #09161c;
    --color-subtle: #14252d; --color-subtle-2: #1b3039;
    --color-line: #1b3039; --color-line-2: #29434e; --color-line-soft: #12232b;
    --color-ink: #e5f3f7; --color-ink-2: #c2dae3; --color-body: #9ebbc6;
    --color-muted: #82a3af; --color-faint: #648894; --color-faintest: #426570;
    --color-accent: #e5f3f7; --color-accent-2: #c2dae3; --color-on-accent: #061015;
    --color-brand-fg: #67c9e4; --color-brand-soft: #0b2834;

  html[data-theme="emerald"] {

    --color-muted: #5d7d72; --color-faint: #7f9a91; --color-faintest: #b2c6bf;
    --color-accent: #102c23; --color-accent-2: #284a3f; --color-on-accent: #ffffff;
    --color-brand-fg: #047857; --color-brand-soft: #ecfdf5;

  html[data-theme="emerald"].dark {

    --color-brand-300: #5bd4aa; --color-brand-500: #047857; --color-brand-600: #065f46; --color-brand-700: #064e3b;
    --color-canvas: #07110e; --color-surface: #0f1d18; --color-panel: #0a1713;

    --color-line: #1d342b; --color-line-2: #2b493e; --color-line-soft: #13261f;
    --color-ink: #e6f4ef; --color-ink-2: #c4ddd4; --color-body: #a1beb4;
    --color-muted: #85a69a; --color-faint: #688b7f; --color-faintest: #466b5e;
    --color-accent: #e6f4ef; --color-accent-2: #c4ddd4; --color-on-accent: #07110e;

  /* Applied before first paint by the inline script below. */
  html { color-scheme: light; }
  html.dark { color-scheme: dark; }

  #sidebar { width: 15rem; transition: width 180ms ease; }
  #sidebar[data-minimized="true"] { width: 5rem; }
  #sidebar[data-minimized="true"] .sidebar-label,
  #sidebar[data-minimized="true"] .sidebar-heading,
  #sidebar[data-minimized="true"] .sidebar-account-count { display: none; }
  #sidebar[data-minimized="true"] .sidebar-logo { justify-content: center; padding-inline: 0.75rem; }
  #sidebar[data-minimized="true"] .sidebar-scroll,
  #sidebar[data-minimized="true"] .sidebar-footer { padding-inline: 0.75rem; }
  .sidebar-account-alias { display: none; }
  #sidebar[data-minimized="true"] [data-sidebar-link] { justify-content: center; gap: 0; }
  #sidebar[data-minimized="true"] [data-sidebar-account] { justify-content: flex-start; gap: 0.375rem; }
  #sidebar[data-minimized="true"] .sidebar-account-alias { display: inline; }
  #sidebar[data-minimized="true"] [data-sidebar-badge] {
    position: absolute;
    right: 0.125rem;
    top: 0.125rem;
    min-width: 1rem;
    padding-inline: 0.25rem;
    text-align: center;
  }
  #sidebar[data-minimized="true"] .sidebar-toggle-icon { transform: rotate(180deg); }

  @media (prefers-reduced-motion: reduce) {
    #sidebar { transition: none; }

</style>

<script>
  // Runs before the body renders so a dark-mode user never sees a white flash.
  try {
    var palettes = ["violet", "ocean", "emerald", "custom"];
    var modes = ["system", "light", "dark"];
    var palette = localStorage.getItem("serverManager.colorTheme");
    var mode = localStorage.getItem("serverManager.theme");
    if (palettes.indexOf(palette) < 0) palette = "violet";
    if (modes.indexOf(mode) < 0) mode = "system";
    var dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = palette;
    document.documentElement.classList.toggle("dark", dark);
    if (palette === "custom") {
      var stored_tokens = JSON.parse(localStorage.getItem("serverManager.customThemeTokens") || "null");
      var custom_tokens = stored_tokens && stored_tokens[dark ? "dark" : "light"];
      if (!custom_tokens) {
        document.documentElement.dataset.theme = "violet";
      } else {
        Object.keys(custom_tokens).forEach(function (property) {
          var value = custom_tokens[property];
          if (property.indexOf("--color-") === 0 && /^#[0-9a-f]{6}$/i.test(value)) {
            document.documentElement.style.setProperty(property, value);
          }
        });
      }
    }
  } catch (e) {
    document.documentElement.dataset.theme = "violet";
    document.documentElement.classList.toggle("dark", matchMedia("(prefers-color-scheme: dark)").matches);
  }
</script>
</head>

<!-- overflow-hidden guarantees only the sidebar and main pane scroll, never
     the document, so the shell can never be pushed off-screen. -->
<body class="h-full overflow-hidden bg-canvas text-ink antialiased">

<div id="app" class="h-full">

  <!-- The sign-in screen renders here with #shell hidden, and hands over
       once there is a session. Both start out of the way so a signed-in
       reload never flashes the form, and a signed-out one never flashes
       the board. -->
  <div id="auth-root" class="hidden h-full"></div>

  <div id="shell" class="hidden h-full">
  <div class="flex h-full w-full overflow-hidden bg-surface">

    <!-- ═══ SIDEBAR ═══ -->
    <aside id="sidebar" data-minimized="false" class="relative flex h-full shrink-0 flex-col border-r border-line">
      <a href="#dashboard" title="Dashboard" class="sidebar-logo flex shrink-0 items-center gap-2.5 px-6 pt-6">
        <span class="grid h-9 w-9 place-items-center rounded-xl bg-brand-500 text-white shadow-lg shadow-brand-500/30">
          <svg class="h-4.5 w-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <rect x="3" y="4" width="18" height="6" rx="2"></rect><rect x="3" y="14" width="18" height="6" rx="2"></rect>
            <path d="M7 7h.01M7 17h.01"></path>
          </svg>
        </span>
        <span class="sidebar-label text-[17px] font-bold tracking-tight">Glophics</span>
      </a>

      <button type="button" data-action="toggle-sidebar" aria-controls="sidebar" aria-expanded="true"
              title="Minimize sidebar"
              class="absolute -right-3 top-7 z-20 grid h-7 w-7 place-items-center rounded-full bg-surface text-faint shadow-sm ring-1 ring-line-2 transition hover:bg-brand-soft hover:text-brand-fg">
        <svg class="sidebar-toggle-icon h-3.5 w-3.5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"></path>
        </svg>
        <span class="sr-only">Minimize sidebar</span>
      </button>

      <!-- Only this middle column scrolls. The logo above and the settings
           group below stay pinned however long the account list grows. -->
      <div class="sidebar-scroll no-scrollbar min-h-0 flex-1 overflow-y-auto px-5 pb-4 pt-8">
        <nav>
          <p class="sidebar-heading px-3 pb-2 text-[10px] font-bold tracking-[0.14em] text-faint">OVERVIEW</p>
          <div class="space-y-1" data-nav-group="overview"></div>
        </nav>

        <nav class="mt-7">
          <p class="sidebar-heading px-3 pb-2 text-[10px] font-bold tracking-[0.14em] text-faint">ACTIVITY</p>
          <div class="space-y-1" data-nav-group="activity"></div>
        </nav>

        <div class="mt-7">
          <p class="sidebar-heading px-3 pb-2 text-[10px] font-bold tracking-[0.14em] text-faint">ACCOUNTS</p>
          <div class="space-y-0.5" id="nav-accounts"></div>
        </div>
      </div>

      <div class="sidebar-footer shrink-0 space-y-1 px-5 pb-6 pt-2">
        <p class="sidebar-heading px-3 pb-2 text-[10px] font-bold tracking-[0.14em] text-faint">SETTINGS</p>
        <div class="space-y-1" data-nav-group="settings"></div>
      </div>
    </aside>

    <!-- ═══ MAIN ═══ -->
    <div class="flex min-w-0 flex-1 flex-col bg-panel">
      <header class="flex shrink-0 items-center gap-3 px-4 py-4 sm:gap-5 sm:px-6 lg:px-7 lg:py-5">
        <label class="flex h-11 flex-1 items-center gap-3 rounded-full bg-surface px-5 shadow-sm ring-1 ring-line">
          <svg class="h-4 w-4 shrink-0 text-faint" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L21 21"></path>
          </svg>
          <input id="search-input" type="text" placeholder="Search environment, person, ticket…"
                 class="w-full bg-transparent text-sm text-ink-2 placeholder:text-faint focus:outline-none" />
        </label>

        <div id="sync-indicator" class="hidden max-w-[160px] shrink-0 items-center gap-2 text-xs font-medium text-muted md:flex"></div>

        <button data-action="sync-jira" title="Sync Jira now"
                class="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-surface text-muted shadow-sm ring-1 ring-line transition hover:text-brand-fg">
          <svg class="h-4.5 w-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M20 11a8 8 0 10-2.3 5.6"></path><path d="M20 4.5V11h-6.5"></path>
          </svg>
        </button>

        <div id="appearance-switcher" class="relative shrink-0">
          <button id="theme-toggle" type="button" data-action="toggle-appearance"
                  aria-label="Open appearance settings" aria-haspopup="true"
                  aria-expanded="false" aria-controls="appearance-popover"
                  class="grid h-11 w-11 place-items-center rounded-full bg-surface text-muted shadow-sm ring-1 ring-line transition hover:text-brand-fg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2 focus-visible:ring-offset-panel"></button>
          <div id="appearance-popover" hidden></div>
        </div>

        <div class="h-8 w-px shrink-0 bg-line-2"></div>

        <!-- Filled by Shell.renderAccountMenu(): who is signed in, their role,
             and the dropdown holding Change password / Sign out. -->
        <div id="account-menu" class="relative shrink-0"></div>
      </header>

      <main id="view" class="no-scrollbar min-h-0 flex-1 overflow-y-auto"></main>
    </div>
  </div>
  </div>
</div>

<div id="modal-host"></div>

<canvas id="confetti-canvas" aria-hidden="true"></canvas>
